name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: shellcheck scripts/*.sh scripts/lib/*.sh || true
      - name: Verificar scripts ejecutables
        run: |
          for f in scripts/*.sh; do
            [ -x "$f" ] || (echo "❌ $f sin permiso ejecutable"; exit 1)
          done
